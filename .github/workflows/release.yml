name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.6.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # WebKitGTK and GTK headers are needed to link the Tauri binary.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            build-essential \
            pkg-config \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build .deb and AppImage
        run: npm run build

      # Bundle filenames contain a space ("Universe 3D_1.6.0_amd64.deb"), which
      # makes for awkward download URLs. Rename to a hyphenated form and report
      # the version so the release body can reference it.
      - name: Collect artifacts
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          deb=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -1)
          cp "$deb" "dist/universe-3d_${version}_amd64.deb"

          appimage=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -1)
          cp "$appimage" "dist/universe-3d_${version}_amd64.AppImage"

          # Strip the libraries that have to come from the host. Without this
          # the AppImage only runs on distributions as old as the runner.
          bash scripts/fix-appimage.sh "dist/universe-3d_${version}_amd64.AppImage"

          # Checksums so downloads can be verified.
          (cd dist && sha256sum ./* > SHA256SUMS.txt)
          ls -la dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Universe 3D ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            ## Install

            **Debian / Ubuntu / Kali**

            ```bash
            sudo dpkg -i universe-3d_${{ steps.collect.outputs.version }}_amd64.deb
            ```

            **AppImage (any distribution, no installation)**

            ```bash
            chmod +x universe-3d_${{ steps.collect.outputs.version }}_amd64.AppImage
            ./universe-3d_${{ steps.collect.outputs.version }}_amd64.AppImage
            ```

            Verify a download with `sha256sum -c SHA256SUMS.txt`.
          files: |
            dist/*.deb
            dist/*.AppImage
            dist/SHA256SUMS.txt
